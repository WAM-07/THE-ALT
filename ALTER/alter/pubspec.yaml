version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^13.2.0

  # Storage
  hive: ^2.2.3
