name: alter
description: "ALTER: create, train and chat with your personal AI. Part of The ALT Ecosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # One ALT account, shared with ALTERA and ALTAR
  alt_account:
    path: ../../packages/alt_account

  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^13.2.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  
  # UI & Animation
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.0

  # Utilities
  uuid: ^4.5.0
  image_picker: ^1.1.0
  file_picker: ^8.1.2
  http: ^1.6.0
  http_parser: ^4.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_secure_storage: ^9.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
