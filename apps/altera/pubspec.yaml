name: altera_app
description: "ALTERA — Hybrid AI Social Hub | The ALT Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3
  web_socket_channel: ^3.0.1

  # Auth & Storage (one ALT account, shared with ALTER and ALTAR)
  alt_account:
    path: ../../packages/alt_account
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI & Fonts
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.8.7
  just_audio: ^0.9.39
  record: ^6.2.0
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/altera_logo.png"
  web:
    generate: true
    image_path: "assets/images/altera_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
