# Every test on every push and pull request. No secrets needed: the backend tests start their own
# embedded Postgres and Hardhat chain, and the ML service is optional (Core falls back without it).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Core, gateway, ALTERA, ALTAR, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Contract coverage
        run: npm run coverage -w @alt/contracts

  flutter:
    name: Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [packages/alt_account, apps/alter, apps/altera]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      # Errors fail the build; the older ALTERA code still has warnings and infos to clear.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
