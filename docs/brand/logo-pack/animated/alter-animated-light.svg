<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"><title>ALTER animated logo (light background)</title><style>
.len-hex{--len:258}.len-a{--len:88}.len-sq{--len:272}.len-coin{--len:264}.len-ring{--len:220}.len-in{--len:37}.len-out{--len:55}
.draw,.drawa,.drawb{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.draw{animation:d 5s cubic-bezier(.6,0,.2,1) infinite}.drawa{animation:da 5s cubic-bezier(.6,0,.2,1) infinite}.drawb{animation:db 5s cubic-bezier(.6,0,.2,1) infinite}
.pop,.ping,.twinkle,.flip,.type{transform-box:fill-box;transform-origin:center}
.pop{animation:pop 5s ease-out infinite}.ping{opacity:0;animation:ping 5s ease-out infinite}.twinkle{animation:tw 5s ease-in-out infinite}
.flip{animation:flip 5s ease-in-out infinite}.type{animation:type 5s ease-in-out infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
.wave{animation:wave 5s ease-in-out infinite}.late{animation-delay:.25s}
@keyframes d{0%{stroke-dashoffset:var(--len);opacity:1}28%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
@keyframes da{0%,16%{stroke-dashoffset:var(--len);opacity:1}38%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
@keyframes db{0%,10%{stroke-dashoffset:var(--len);opacity:1}34%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:var(--len);opacity:0}}
@keyframes pop{0%,36%{transform:scale(0);opacity:0}44%{transform:scale(1.3);opacity:1}50%{transform:scale(1)}86%{transform:scale(1);opacity:1}96%,100%{transform:scale(0);opacity:0}}
@keyframes ping{0%,50%{transform:scale(1);opacity:0}52%{opacity:.9}76%,100%{transform:scale(3.4);opacity:0}}
@keyframes tw{0%,36%{transform:scale(0) rotate(-90deg);opacity:0}46%{transform:scale(1.25) rotate(0);opacity:1}52%{transform:scale(1) rotate(0)}62%{transform:scale(1.3) rotate(45deg)}70%{transform:scale(1) rotate(90deg)}86%{transform:scale(1) rotate(90deg);opacity:1}96%,100%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes flip{0%,52%{transform:scaleX(1)}60%{transform:scaleX(.06)}68%,100%{transform:scaleX(1)}}
@keyframes type{0%,38%{transform:translateY(0);opacity:0}42%{opacity:1}48%{transform:translateY(-5px)}54%{transform:translateY(0)}62%{transform:translateY(-5px)}68%{transform:translateY(0)}86%{transform:translateY(0);opacity:1}96%,100%{opacity:0}}
@keyframes wave{0%,50%{opacity:1}57%{opacity:.25}64%{opacity:1}71%{opacity:.25}78%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.draw,.drawa,.drawb{animation:none;stroke-dashoffset:0}.pop,.twinkle,.flip,.type,.wave{animation:none}.ping{animation:none;opacity:0}}
</style><rect class="draw len-sq" x="11" y="11" width="78" height="78" rx="24" fill="none" stroke="#2152D9" stroke-width="7"/><path class="drawa len-a" d="M32 71 L50 31 L68 71" fill="none" stroke="#0E1525" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path class="twinkle" d="M50 54.5 Q51.1 59.9 56.5 61 Q51.1 62.1 50 67.5 Q48.9 62.1 43.5 61 Q48.9 59.9 50 54.5 Z" fill="#2152D9"/></svg>
